name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # Pi loads extensions as TypeScript through jiti; the build script only
        # runs a typecheck gate, so no lifecycle scripts are required.
        run: npm install --ignore-scripts

      - name: Lint (Biome)
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm run test -- --no-color
